appId: com.qqxyfb.qqaichatbot
productName: QQAiChatBot
copyright: Copyright © 2026 qqxyfb

# 必须使用内置 Node >= 22.5 的 Electron（node:sqlite 依赖）
# Electron 33/34 内置 Node 20，不支持 node:sqlite，会导致服务进程启动即崩溃
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - web/dist/**/*
  - resources/**/*
  - electron/**/*
  - package.json

asar: true

win:
  # 无管理员权限环境无法解压 winCodeSign（符号链接），关闭签名与 exe 资源编辑
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: QQAiChatBot-${version}-${arch}.${ext}

nsis:
  # 名称含 Setup，供客户端更新检测（pickAsset 优先匹配 setup/installer）
  artifactName: QQAiChatBot-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QQ AI ChatBot

portable:
  artifactName: QQAiChatBot-Portable-${version}.${ext}

linux:
  target:
    - tar.gz
  category: Utility
  artifactName: QQAiChatBot-linux-${version}.${ext}
